[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "homesmartlink"
version = "0.1.0"
description = "Async client for the Home-SmartLink (Carrera) heating cloud API"
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Michaël Fery", email = "fery.michael@gmail.com" }]
dependencies = ["aiohttp>=3.10"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: AsyncIO",
    "Programming Language :: Python :: 3.13",
    "Topic :: Home Automation",
    "Typing :: Typed",
]

[project.urls]
Source = "https://github.com/michaelfery/home-smartlink-ha"

[dependency-groups]
dev = [
    "mypy>=1.11",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]
ha = [
    "pytest-homeassistant-custom-component==0.13.373; python_full_version >= '3.14.2'",
]

[tool.hatch.build.targets.wheel]
packages = ["homesmartlink"]

[tool.hatch.build.targets.sdist]
include = ["homesmartlink", "README.md", "LICENSE"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
# Client tests run without the Home Assistant plugin (it blocks sockets);
# integration tests: pytest -o addopts= tests/components
addopts = "-p no:homeassistant"
testpaths = ["tests/client"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["homesmartlink", "custom_components"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "ASYNC"]

[[tool.mypy.overrides]]
# Home Assistant re-exports its constants implicitly; core integrations rely on it.
module = "homeassistant.*"
implicit_reexport = true

[tool.ruff.lint.per-file-ignores]
# Home Assistant entities declare their _attr_* lists at class level.
"custom_components/**" = ["RUF012"]
